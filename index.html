<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>域名发布公告</title>
<style>
/* ===== 原有样式（未改动） ===== */
* { box-sizing: border-box; }
body { margin: 0; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #fff; }
.container { background: rgba(255, 255, 255, 0.1); padding: 40px; border-radius: 15px; text-align: center; max-width: 500px; width: 100%; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 2px solid rgba(255, 255, 255, 0.3); box-shadow: 0 0 30px rgba(255, 255, 255, 0.3); animation: fadeIn 1.5s ease-in; }
h1 { font-size: 2.2em; margin-bottom: 20px; letter-spacing: 1px; text-shadow: 0 0 10px rgba(255, 235, 59, 0.8), 0 0 20px rgba(255, 235, 59, 0.6); }
p { font-size: 1.1em; margin-bottom: 15px; line-height: 1.6; text-shadow: 0 0 8px rgba(255, 255, 255, 0.5); }
.domain { font-size: 2.5em; font-weight: bold; color: #ffeb3b; margin: 20px 0; overflow-wrap: anywhere; text-shadow: 0 0 15px rgba(255, 235, 59, 0.9), 0 0 30px rgba(255, 235, 59, 0.7); animation: pulse 1.5s infinite; }
.btn { display: inline-block; margin-top: 15px; padding: 14px 32px; background: #ffeb3b; color: #000; font-size: 1.2em; font-weight: bold; text-decoration: none; border-radius: 8px; box-shadow: 0 0 15px rgba(255, 235, 59, 0.4); transition: all 0.3s ease; text-shadow: none; }
.btn:hover { background: #fff176; transform: translateY(-3px); box-shadow: 0 0 25px rgba(255, 235, 59, 0.8); }
.btn:active { transform: scale(0.97); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 0%, 100% { text-shadow: 0 0 15px rgba(255, 235, 59, 0.9), 0 0 30px rgba(255, 235, 59, 0.7); } 50% { text-shadow: 0 0 20px rgba(255, 235, 59, 1), 0 0 40px rgba(255, 235, 59, 0.8); } }
@media (max-width: 480px) { .container { padding: 28px 20px; } h1 { font-size: 1.8em; } .domain { font-size: 2em; } }

/* ===== 新增：图片旋转验证样式 ===== */
[hidden] { display: none !important; }
.captcha { margin-top: 10px; padding: 20px 16px 18px; border-radius: 14px; background: rgba(0,0,0,.5); border: 1px solid rgba(255,235,59,.4); }
.captcha h2 { margin: 0 0 12px; font-size: 1.7em; color: #ffeb3b; text-shadow: 0 0 12px rgba(255,235,59,.6); }
/* 两步式引导：大字号 */
.steps { list-style: none; margin: 0 0 16px; padding: 0; text-align: left; font-size: 1.1em; font-weight: 600; line-height: 1.5; }
.steps li { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 8px; text-shadow: none; }
.steps i { flex: none; width: 1.7em; height: 1.7em; border-radius: 50%; background: #ffeb3b; color: #000; font-style: normal; font-weight: 800; text-align: center; line-height: 1.7em; }
/* 待验证图（大）：固定正方形，旋转只发生在框内，不会引起页面抖动 */
.tile { position: relative; width: 100%; max-width: 280px; margin: 0 auto; aspect-ratio: 1 / 1; background: #f4f4f4; border-radius: 16px; overflow: hidden; cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; box-shadow: 0 0 0 4px #ffeb3b, 0 0 24px rgba(255,235,59,.65); user-select: none; -webkit-user-select: none; }
.tile:active { filter: brightness(.92); }
.tile:focus-visible { box-shadow: 0 0 0 4px #fff, 0 0 24px rgba(255,255,255,.8); }
.tile > svg.main { display: block; width: 100%; height: 100%; transition: transform .35s ease; }
/* 参考图（小）：右上角示意，始终正立 */
.thumb { position: absolute; top: 8px; right: 8px; width: 26%; aspect-ratio: 1 / 1; background: #fff; border: 2px solid #43a047; border-radius: 10px; overflow: hidden; pointer-events: none; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.thumb svg { display: block; width: 100%; height: 100%; }
.thumb b { position: absolute; left: 0; right: 0; bottom: 0; background: #43a047; color: #fff; font-size: 11px; line-height: 16px; text-align: center; }
/* 提示徽标 */
.hint { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); padding: 3px 12px; background: rgba(0,0,0,.65); color: #fff; font-size: 13px; border-radius: 999px; white-space: nowrap; pointer-events: none; }
.ctrl { display: flex; gap: 12px; margin-top: 16px; }
.ctrl button, .go { font: inherit; font-weight: bold; border: 0; border-radius: 12px; cursor: pointer; min-height: 56px; -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: transform .1s, filter .1s, opacity .2s; }
.ctrl button { flex: 1; background: rgba(255,255,255,.16); color: #fff; font-size: 1.15em; border: 1px solid rgba(255,255,255,.35); }
.go { width: 100%; margin-top: 12px; background: #ffeb3b; color: #000; font-size: 1.2em; box-shadow: 0 0 15px rgba(255,235,59,.4); }
.ctrl button:active, .go:active { transform: scale(.95); filter: brightness(.85); }
.captcha.busy button, .captcha.busy .tile { opacity: .55; pointer-events: none; }
.status { min-height: 1.6em; margin: 12px 0 0; font-size: 1.1em; font-weight: 700; text-shadow: none; }
.status.ok { color: #7CFC9A; }
.status.err { color: #ff8a80; }
.captcha.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) { .tile > svg.main { transition: none; } .captcha.shake { animation: none; } }
@media (max-width: 480px) { .captcha h2 { font-size: 1.5em; } .steps { font-size: 1.05em; } }
</style>
</head>
<body>
<div class="container">
  <h1>域名发布公告</h1>
  <p>本页面为永久网址，请务必收藏</p>
  <p class="domain">tgios.top</p>

  <!-- 新增：旋转验证卡片 -->
  <div class="captcha" id="captcha">
    <h2>把图片转正，才能继续</h2>
    <ol class="steps">
      <li><i>1</i><span>点下方 ↺ ↻ 按钮（或直接点图片），把图片转到和右上角小图一样</span></li>
      <li><i>2</i><span>点「验证并继续」</span></li>
    </ol>
    <div class="tile" id="tile" role="button" tabindex="0" aria-label="待验证图片，点击顺时针旋转 90 度">
      <svg class="main" id="rotImg" viewBox="-6 -6 112 112"></svg>
      <div class="thumb"><svg id="refImg" viewBox="-6 -6 112 112"></svg><b>正确方向</b></div>
      <span class="hint">↻ 点图片可旋转</span>
    </div>
    <div class="ctrl">
      <button type="button" id="btnL" aria-label="向左旋转">↺ 向左转</button>
      <button type="button" id="btnR" aria-label="向右旋转">向右转 ↻</button>
    </div>
    <button type="button" class="go" id="btnGo">验证并继续</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>
  <noscript><p>请开启 JavaScript 后继续访问。</p></noscript>

  <!-- 原有提示语与按钮：验证成功后一起显示（链接保持不变） -->
  <div id="after" hidden>
    <p>请点击下方按钮，前往最新网址</p>
    <a class="btn" href="https://tgmtp.top">
      前往最新网址 →
    </a>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ===== 配置 ===== */
  var MAX_FAILS = 5;       // 连续失败上限，达到后冷却
  var COOLDOWN_MS = 5000;  // 冷却时间（毫秒）
  var TARGET = 0;          // 目标方向固定为正立（0°）

  /* ===== 12 个内置 SVG 图案（均以“正立”为设计方向，顶部特征明确） ===== */
  var SHAPES = [
    // 1 房子
    '<polygon points="50,12 12,48 88,48"/><rect x="22" y="48" width="56" height="40"/><rect x="70" y="22" width="8" height="18"/><rect x="44" y="62" width="12" height="26" fill="#fff"/>',
    // 2 火箭
    '<path d="M50 8C66 24 68 46 62 70L38 70C32 46 34 24 50 8Z"/><polygon points="38,58 24,78 38,72"/><polygon points="62,58 76,78 62,72"/><circle cx="50" cy="36" r="7" fill="#fff"/><polygon points="42,72 58,72 50,94" fill="#ff9800"/>',
    // 3 树
    '<rect x="45" y="66" width="10" height="24" fill="#6d4c41"/><polygon points="50,10 22,44 78,44"/><polygon points="50,28 16,66 84,66"/>',
    // 4 雨伞
    '<path d="M10 52A40 40 0 0 1 90 52Z"/><path d="M50 52V80a8 8 0 0 1-16 0" fill="none" stroke="#444" stroke-width="5" stroke-linecap="round"/>',
    // 5 旗子
    '<rect x="28" y="10" width="6" height="80" fill="#555"/><polygon points="34,12 82,28 34,44"/><rect x="18" y="86" width="26" height="6" fill="#555"/>',
    // 6 猫脸
    '<circle cx="50" cy="58" r="30"/><polygon points="22,38 28,8 46,28"/><polygon points="78,38 72,8 54,28"/><circle cx="40" cy="54" r="4" fill="#fff"/><circle cx="60" cy="54" r="4" fill="#fff"/><polygon points="45,66 55,66 50,72" fill="#fff"/>',
    // 7 蘑菇
    '<rect x="38" y="52" width="24" height="36" rx="4" fill="#e8d9bd"/><path d="M10 56A40 38 0 0 1 90 56Z"/><circle cx="34" cy="40" r="6" fill="#fff"/><circle cx="58" cy="32" r="5" fill="#fff"/><circle cx="72" cy="46" r="4" fill="#fff"/>',
    // 8 冰淇淋
    '<polygon points="32,52 68,52 50,92" fill="#d9a066"/><circle cx="50" cy="38" r="22"/><circle cx="50" cy="12" r="6" fill="#e53935"/>',
    // 9 帆船
    '<path d="M12 70H88L76 88H24Z" fill="#555"/><rect x="48" y="10" width="4" height="60" fill="#555"/><polygon points="54,14 54,66 84,66"/><polygon points="46,26 46,66 22,66" fill="#ffd54f"/>',
    // 10 灯泡
    '<circle cx="50" cy="38" r="26"/><rect x="38" y="62" width="24" height="8" fill="#666"/><rect x="40" y="72" width="20" height="8" fill="#666"/><rect x="44" y="82" width="12" height="7" fill="#666"/>',
    // 11 蜡烛
    '<path d="M50 6C61 20 63 28 50 36C37 28 39 20 50 6Z" fill="#ff9800"/><rect x="48" y="34" width="4" height="9" fill="#333"/><rect x="32" y="43" width="36" height="46" rx="3"/>',
    // 12 皇冠
    '<polygon points="14,70 12,32 34,52 50,24 66,52 88,32 86,70"/><rect x="14" y="72" width="72" height="14" rx="3" fill="#ffb300"/><circle cx="12" cy="30" r="5" fill="#ffb300"/><circle cx="50" cy="22" r="5" fill="#ffb300"/><circle cx="88" cy="30" r="5" fill="#ffb300"/>'
  ];
  var COLORS = ['#e53935', '#1e88e5', '#43a047', '#8e24aa', '#f57c00', '#00897b'];

  var $ = function (id) { return document.getElementById(id); };
  var card = $('captcha'), refImg = $('refImg'), rotImg = $('rotImg'), statusEl = $('status');

  var deg = 0;                       // 待验证图当前累计角度（可为负/超 360，保证动画连续）
  var locked = false, done = false;  // 锁定中 / 已通过
  var fails = 0, lastShape = -1;

  /* 安全随机整数 [0, n) */
  function rnd(n) {
    if (window.crypto && crypto.getRandomValues) {
      var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n;
    }
    return Math.floor(Math.random() * n);
  }
  function norm(d) { return ((d % 360) + 360) % 360; }
  function setStatus(msg, cls) { statusEl.textContent = msg || ''; statusEl.className = 'status ' + (cls || ''); }

  /* 设置旋转角度；animate=false 时无动画直接跳转 */
  function apply(el, d, animate) {
    if (!animate) el.style.transition = 'none';
    el.style.transform = 'rotate(' + d + 'deg)';
    if (!animate) { void el.getBoundingClientRect(); el.style.transition = ''; }
  }

  /* 生成新题：随机图案 + 随机颜色 + 随机初始角度（90/180/270，不会已经是正立） */
  function newQuestion() {
    var s; do { s = rnd(SHAPES.length); } while (s === lastShape);
    lastShape = s;
    var html = '<g fill="' + COLORS[rnd(COLORS.length)] + '">' + SHAPES[s] + '</g>';
    refImg.innerHTML = html;
    rotImg.innerHTML = html;
    deg = (rnd(3) + 1) * 90;
    apply(rotImg, deg, false);
    setStatus('');
    locked = false; card.classList.remove('busy');
  }

  function rotate(step) {
    if (locked || done) return;
    deg += step;
    apply(rotImg, deg, true);
    setStatus('');
  }

  function verify() {
    if (locked || done) return;      // 防重复触发
    locked = true; card.classList.add('busy');
    setStatus('验证中…');
    setTimeout(function () {
      if (norm(deg) === TARGET) {    // 以角度数值校验，不依赖视觉状态
        done = true;
        setStatus('✓ 验证成功', 'ok');
        setTimeout(function () {
          card.hidden = true;
          $('after').hidden = false; // 验证成功：显示原有提示语与“前往最新网址”按钮
        }, 600);
      } else {
        fails++;
        card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
        if (fails >= MAX_FAILS) {
          setStatus('✗ 尝试次数过多，请 ' + (COOLDOWN_MS / 1000) + ' 秒后重试', 'err');
          setTimeout(function () { fails = 0; newQuestion(); }, COOLDOWN_MS);
        } else {
          setStatus('✗ 方向不对，已换一题，再试一次', 'err');
          setTimeout(newQuestion, 900);
        }
      }
    }, 300);
  }

  $('btnL').addEventListener('click', function () { rotate(-90); });
  $('btnR').addEventListener('click', function () { rotate(90); });
  $('tile').addEventListener('click', function () { rotate(90); });   // 点击图片顺时针旋转
  $('tile').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); rotate(90); }
  });
  $('btnGo').addEventListener('click', verify);
  newQuestion();
})();
</script>
</body>
</html>
