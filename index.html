<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客服组件测试页面</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, sans-serif; color: #172033; background: #f3f6fc; }
    main { width: 100%; max-width: 560px; padding: 40px; background: white; border-radius: 16px; box-shadow: 0 12px 40px #1720330a; }
    h1 { margin: 0 0 16px; font-size: 28px; }
    p { margin: 12px 0; line-height: 1.8; color: #596579; }
    .tag { display: inline-block; margin-bottom: 20px; padding: 5px 12px; border-radius: 20px; background: #eaf0ff; color: #2563eb; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <span class="tag">客服组件演示</span>
    <h1>你好，欢迎访问 👋</h1>
    <p>这是一个简单的测试页面。</p>
    <p>点击右下角的客服按钮，填写邮箱并发送消息，即可测试在线咨询与 Telegram 回复。</p>
  </main>
  <script src="https://crisp.govg.de/widget.js" data-site-id="b3c081a4-c075-404f-be24-aab2341661d1" async></script>
</body>
</html>
